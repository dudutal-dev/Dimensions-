# בנייה, בדיקות ופריסה ל-GitHub Pages (SPEC ARD-10).
# הפריסה תלויה ב-build בלבד (תוכן, טיפוסים, בדיקות יחידה, תקציב bundle, בדיקת מפתחות).
# בדיקות ה-e2e רצות במקביל ומדווחות, אבל אינן חוסמות פריסה — WebKit ב-CI רגיש לעומס.
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (content check + typecheck + vite build)
        run: npm run build
      - name: Bundle budget, secret scan, PWA assets
        run: npm run dist:check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # מפעיל את GitHub Pages במאגר בפעם הראשונה (Source: GitHub Actions) — בלי הגדרה ידנית
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - name: QA sweep (all screens, 320px, large text, light theme) and load metrics
        run: npm run e2e:qa
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
